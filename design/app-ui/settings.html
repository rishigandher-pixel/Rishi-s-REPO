<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings | PitchStudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div class="flex h-screen overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-64 bg-slate-900 text-white flex flex-col">
            <div class="p-6 flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center font-bold text-white">P</div>
                <span class="text-xl font-bold tracking-tight">Pitch<span class="text-indigo-400">Studio</span></span>
            </div>
            
            <nav class="flex-grow px-4 py-4 space-y-1">
                <a href="dashboard.html" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800 hover:text-white px-4 py-2.5 rounded-lg font-medium transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    <span>Dashboard</span>
                </a>
                <a href="#" class="flex items-center space-x-3 text-slate-400 hover:bg-slate-800 hover:text-white px-4 py-2.5 rounded-lg font-medium transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                    <span>Proposals</span>
                </a>
            </nav>
            
            <div class="p-4 border-t border-slate-800">
                <a href="settings.html" class="flex items-center space-x-3 bg-indigo-600 text-white px-4 py-2.5 rounded-lg font-medium transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>Settings</span>
                </a>
                <div class="mt-4 flex items-center space-x-3 px-4">
                    <div class="w-8 h-8 bg-slate-700 rounded-full"></div>
                    <div class="text-sm">
                        <div class="font-bold truncate">Alex Rivera</div>
                        <div class="text-slate-500 text-xs truncate">Pro Plan</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-grow flex flex-col overflow-hidden">
            
            <header class="bg-white border-b border-slate-200 px-8 py-4 flex items-center justify-between">
                <h2 class="text-xl font-bold text-slate-900">Settings</h2>
                <button class="bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-bold hover:bg-indigo-700 transition">Save Changes</button>
            </header>

            <div class="flex-grow overflow-y-auto p-8 bg-slate-50">
                <div class="max-w-4xl mx-auto space-y-8">
                    
                    <!-- Account Section -->
                    <section class="bg-white rounded-xl border border-slate-200 shadow-sm">
                        <div class="px-6 py-4 border-b border-slate-100 font-bold text-slate-900">Account Profile</div>
                        <div class="p-6 grid grid-cols-2 gap-6">
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-slate-400 uppercase">Full Name</label>
                                <input type="text" value="Alex Rivera" class="w-full bg-slate-50 border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500 transition">
                            </div>
                            <div class="space-y-1">
                                <label class="text-xs font-bold text-slate-400 uppercase">Email Address</label>
                                <input type="email" value="alex@riveradesign.io" class="w-full bg-slate-50 border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500 transition">
                            </div>
                        </div>
                    </section>

                    <!-- Custom Branding Section -->
                    <section class="bg-white rounded-xl border border-slate-200 shadow-sm">
                        <div class="px-6 py-4 border-b border-slate-100 font-bold text-slate-900">Custom Branding</div>
                        <div class="p-6 space-y-6">
                            <div class="flex items-start space-x-8">
                                <div class="space-y-2">
                                    <label class="text-xs font-bold text-slate-400 uppercase">Brand Logo</label>
                                    <div class="w-24 h-24 bg-slate-50 border-2 border-dashed border-slate-200 rounded-xl flex items-center justify-center text-slate-300 hover:text-indigo-400 hover:border-indigo-200 cursor-pointer transition">
                                        <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                                    </div>
                                </div>
                                <div class="flex-grow space-y-4">
                                    <div class="grid grid-cols-2 gap-4">
                                        <div class="space-y-1">
                                            <label class="text-xs font-bold text-slate-400 uppercase">Primary Color</label>
                                            <div class="flex items-center space-x-2">
                                                <div class="w-10 h-10 bg-[#4F46E5] rounded-lg border border-slate-200"></div>
                                                <input type="text" value="#4F46E5" class="bg-slate-50 border-slate-200 rounded-lg px-3 py-2 text-sm w-32 font-mono">
                                            </div>
                                        </div>
                                        <div class="space-y-1">
                                            <label class="text-xs font-bold text-slate-400 uppercase">Default Font</label>
                                            <select class="w-full bg-slate-50 border-slate-200 rounded-lg px-4 py-2 text-sm focus:ring-indigo-500 focus:border-indigo-500 transition">
                                                <option>Inter</option>
                                                <option>Montserrat</option>
                                                <option>Playfair Display</option>
                                                <option>Outfit</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Subscription Section -->
                    <section class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                        <div class="px-6 py-4 border-b border-slate-100 font-bold text-slate-900 flex items-center justify-between">
                            <span>Subscription & Billing</span>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-indigo-100 text-indigo-800">Pro Plan</span>
                        </div>
                        <div class="p-6 flex items-center justify-between">
                            <div>
                                <div class="text-sm font-bold text-slate-900">$39.00 USD / month</div>
                                <div class="text-xs text-slate-500">Your next billing date is June 24, 2024.</div>
                            </div>
                            <button class="text-sm font-bold text-indigo-600 hover:text-indigo-700 transition">Manage Billing</button>
                        </div>
                    </section>

                    <!-- Team Section -->
                    <section class="bg-white rounded-xl border border-slate-200 shadow-sm">
                        <div class="px-6 py-4 border-b border-slate-100 font-bold text-slate-900 flex items-center justify-between">
                            <span>Team Members</span>
                            <button class="text-xs font-bold text-indigo-600 hover:text-indigo-700">+ Invite Member</button>
                        </div>
                        <div class="divide-y divide-slate-100">
                            <div class="p-6 flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 bg-slate-100 rounded-full"></div>
                                    <div>
                                        <div class="text-sm font-bold text-slate-900">Alex Rivera (You)</div>
                                        <div class="text-xs text-slate-500">Admin</div>
                                    </div>
                                </div>
                            </div>
                            <div class="p-6 flex items-center justify-between">
                                <div class="flex items-center space-x-3 text-slate-400 italic">
                                    <div class="w-10 h-10 border-2 border-dashed border-slate-200 rounded-full"></div>
                                    <div class="text-sm font-medium">Pending invitation...</div>
                                </div>
                                <button class="text-xs font-bold text-red-500 hover:text-red-700 transition">Revoke</button>
                            </div>
                        </div>
                    </section>

                </div>
            </div>

        </main>

    </div>

</body>
</html>
