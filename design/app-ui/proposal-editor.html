<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor | PitchStudio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .editor-container { height: calc(100vh - 64px); }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 overflow-hidden">

    <!-- Top Bar -->
    <header class="h-16 bg-white border-b border-slate-200 px-6 flex items-center justify-between relative z-20">
        <div class="flex items-center space-x-4">
            <a href="dashboard.html" class="p-2 hover:bg-slate-100 rounded-lg transition">
                <svg class="w-5 h-5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            </a>
            <div class="h-6 w-px bg-slate-200"></div>
            <div>
                <input type="text" value="Acme Corp - Landing Page Redesign" class="font-bold text-slate-900 border-none p-0 focus:ring-0 w-80 text-lg">
                <div class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Draft • Last saved 1m ago</div>
            </div>
        </div>
        
        <div class="flex items-center space-x-6">
            <div class="flex items-center space-x-2">
                <span class="text-xs font-bold text-slate-400 uppercase">Template:</span>
                <select class="text-sm font-semibold text-slate-900 bg-slate-50 border-slate-200 rounded-md py-1.5 px-3 focus:ring-indigo-500 focus:border-indigo-500 transition">
                    <option>Modern (Clean)</option>
                    <option>Professional (Formal)</option>
                    <option>Creative (Bold)</option>
                </select>
            </div>
            <div class="flex items-center space-x-3">
                <button class="px-4 py-2 text-sm font-bold text-slate-600 hover:text-slate-900 transition">Preview</button>
                <button class="px-6 py-2 bg-indigo-600 text-white rounded-lg text-sm font-bold hover:bg-indigo-700 transition shadow-lg shadow-indigo-100">Send Proposal</button>
            </div>
        </div>
    </header>

    <div class="flex editor-container">
        
        <!-- Left Sidebar: Sections -->
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
            <div class="p-4 border-b border-slate-50">
                <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-4">Proposal Sections</div>
                <nav class="space-y-1">
                    <button class="w-full flex items-center justify-between px-3 py-2 text-sm font-medium text-slate-900 bg-indigo-50 rounded-lg group">
                        <span class="flex items-center space-x-3">
                            <svg class="w-4 h-4 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            <span>Cover Page</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-300 opacity-0 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                    </button>
                    <button class="w-full flex items-center justify-between px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg group">
                        <span class="flex items-center space-x-3">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span>Introduction</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-300 opacity-0 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                    </button>
                    <button class="w-full flex items-center justify-between px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg group">
                        <span class="flex items-center space-x-3">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"></path></svg>
                            <span>Scope of Work</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-300 opacity-0 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                    </button>
                    <button class="w-full flex items-center justify-between px-3 py-2 text-sm font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 rounded-lg group">
                        <span class="flex items-center space-x-3">
                            <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            <span>Investment</span>
                        </span>
                        <svg class="w-4 h-4 text-slate-300 opacity-0 group-hover:opacity-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path></svg>
                    </button>
                </nav>
                <button class="mt-4 w-full border border-dashed border-slate-300 rounded-lg py-2 text-xs font-bold text-slate-400 hover:border-indigo-300 hover:text-indigo-600 transition">+ Add Section</button>
            </div>
        </aside>

        <!-- Main Content: Editor Area -->
        <main class="flex-grow bg-slate-100 overflow-y-auto p-12 flex justify-center">
            
            <div class="w-full max-w-3xl space-y-8">
                
                <!-- Section Card -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative group">
                    <div class="p-8 space-y-6">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-indigo-600 uppercase tracking-widest">Cover Page</h3>
                            <button class="flex items-center space-x-2 bg-indigo-50 text-indigo-600 px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-indigo-100 transition">
                                <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20"><path d="M13 6a3 3 0 11-6 0 3 3 0 016 0zM18 8a2 2 0 11-4 0 2 2 0 014 0zM14 15a4 4 0 00-8 0v3h8v-3zM6 8a2 2 0 11-4 0 2 2 0 014 0zM16 18v-3a5.972 5.972 0 00-.75-2.906A3.005 3.005 0 0119 15v3h-3zM4.75 12.094A5.973 5.973 0 004 15v3H1v-3a3 3 0 013.75-2.906z"></path></svg>
                                <span>AI Assistant</span>
                            </button>
                        </div>
                        
                        <div class="space-y-4">
                            <div class="space-y-1">
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Client Name</label>
                                <input type="text" value="Acme Corp" class="w-full bg-slate-50 border-slate-200 rounded-lg px-4 py-3 text-lg font-bold text-slate-900 focus:ring-indigo-500 focus:border-indigo-500 transition">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Proposal Title</label>
                                <input type="text" value="Landing Page Redesign" class="w-full bg-slate-50 border-slate-200 rounded-lg px-4 py-3 text-lg font-bold text-slate-900 focus:ring-indigo-500 focus:border-indigo-500 transition">
                            </div>
                            <div class="space-y-1">
                                <label class="text-[10px] font-bold text-slate-400 uppercase">Description</label>
                                <textarea rows="3" class="w-full bg-slate-50 border-slate-200 rounded-lg px-4 py-3 text-slate-700 focus:ring-indigo-500 focus:border-indigo-500 transition">A comprehensive strategy for modernizing your digital presence and increasing lead conversion by 20%.</textarea>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Drag handle mock -->
                    <div class="absolute left-0 inset-y-0 w-1 bg-transparent group-hover:bg-indigo-200 cursor-move transition"></div>
                </div>

                <!-- Another Section Card -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden relative group opacity-60 hover:opacity-100 transition">
                    <div class="p-8 space-y-4">
                        <div class="flex items-center justify-between">
                            <h3 class="text-sm font-bold text-slate-400 uppercase tracking-widest">Introduction</h3>
                        </div>
                        <div class="h-4 bg-slate-100 rounded w-full"></div>
                        <div class="h-4 bg-slate-100 rounded w-4/5"></div>
                    </div>
                </div>

                <!-- Add Section Button -->
                <div class="flex justify-center">
                    <button class="flex items-center space-x-2 text-slate-400 hover:text-indigo-600 transition py-4">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span class="font-bold text-sm">Add Next Section</span>
                    </button>
                </div>

            </div>

        </main>

        <!-- Right Sidebar: Formatting/Preview Tools (Hidden for now to keep it clean) -->
        <!-- <aside class="w-80 bg-white border-l border-slate-200">
        </aside> -->

    </div>

</body>
</html>
